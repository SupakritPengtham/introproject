<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครเรียน - ขั้นตอนที่ 4 (ข้อมูลผู้ปกครอง)</title>
  <link rel="stylesheet" href="css/parents.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="topband">
      <div class="topband-in">
        <div class="brand">
          <span class="logo">REG</span>
          <div>
            <strong>ระบบสมัครเรียนออนไลน์</strong>
            <small>มหาวิทยาลัยตัวอย่าง</small>
          </div>
        </div>
        <div class="toplinks">
          <a href="#">หน้าหลัก</a>
          <a href="#">คู่มือการสมัคร</a>
        </div>
      </div>
    </div>
  </header>
  <!-- Page Title -->
  <div class="page-head">
    <h1>ระบบสมัครเรียนออนไลน์</h1>
    <p>กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง</p>
  </div>
  <!-- Form Container -->
  <form action="success.html" method="get">
    <!-- 4.1 ข้อมูลบิดา -->
    <fieldset>
      <legend>4.1 ข้อมูลบิดา</legend>
      <label>
        คำนำหน้า <span class="req">*</span>
        <select name="father_prefix" required>
          <option value="">เลือก</option>
          <option value="mr">นาย</option>
        </select>
      </label>
      <label>
        ชื่อบิดา <span class="req">*</span>
        <input type="text" name="father_firstname" required placeholder="ชื่อ">
      </label>
      <label>
        นามสกุลบิดา <span class="req">*</span>
        <input type="text" name="father_lastname" required placeholder="นามสกุล">
      </label>
      <label>
        เบอร์โทรศัพท์ <span class="req">*</span>
        <input type="tel" name="father_phone" required placeholder="0812345678">
      </label>
      <label>
        อาชีพ <span class="req">*</span>
        <input type="text" name="father_occupation" required placeholder="เช่น รับราชการ / ค้าขาย">
      </label>
      <label class="full">
        ที่อยู่บิดา <span class="req">*</span>
        <textarea name="father_address" rows="2" required placeholder="บ้านเลขที่ ถนน ซอย ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์"></textarea>
      </label>
    </fieldset>
    <!-- 4.2 ข้อมูลมารดา -->
    <fieldset>
      <legend>4.2 ข้อมูลมารดา</legend>
      <label>
        คำนำหน้า <span class="req">*</span>
        <select name="mother_prefix" required>
          <option value="">เลือก</option>
          <option value="mrs">นาง</option>
          <option value="ms">นางสาว</option>
        </select>
      </label>
      <label>
        ชื่อมารดา <span class="req">*</span>
        <input type="text" name="mother_firstname" required placeholder="ชื่อ">
      </label>
      <label>
        นามสกุลมารดา <span class="req">*</span>
        <input type="text" name="mother_lastname" required placeholder="นามสกุล">
      </label>
      <label>
        เบอร์โทรศัพท์ <span class="req">*</span>
        <input type="tel" name="mother_phone" required placeholder="0812345678">
      </label>
      <label>
        อาชีพ <span class="req">*</span>
        <input type="text" name="mother_occupation" required placeholder="เช่น รับราชการ / ค้าขาย">
      </label>
      <label class="full">
        ที่อยู่มารดา <span class="req">*</span>
        <textarea name="mother_address" rows="2" required placeholder="บ้านเลขที่ ถนน ซอย ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์"></textarea>
      </label>
    </fieldset>
    <!-- ปุ่มนำทาง -->
    <div class="actions between">
      <a href="school.html" class="btn outline">&larr; ย้อนกลับ (ประวัติการศึกษา)</a>
      <a href="success.html" class="btn success">ยืนยันการสมัครเรียน</a>s
    </div>
  </form>
  <!-- Footer -->
  <footer>
    <div class="wrap">
      <div>
        <h4>ระบบสมัครเรียนออนไลน์</h4>
        <p>สอบถามรายละเอียดเพิ่มเติม โทร. 02-123-4567</p>
      </div>
    </div>
  </footer>
</body>
</html>
